<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Sulthan Hadil cybersecurity banner</title><desc id="desc">Neon cyberpunk security operations banner with animated grid and nodes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#07151a"/></linearGradient><linearGradient id="neon"><stop stop-color="#00ff41"/><stop offset="1" stop-color="#00d9ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity=".12"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/><rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<path d="M0 290H1200" stroke="url(#neon)" stroke-opacity=".35"/><path d="M70 80L240 210 430 120 650 260 900 110 1120 220" fill="none" stroke="#00d9ff" stroke-opacity=".5" stroke-width="2"/>
<g fill="#00ff41" filter="url(#glow)"><circle cx="70" cy="80" r="5"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle><circle cx="240" cy="210" r="5"/><circle cx="430" cy="120" r="5"/><circle cx="650" cy="260" r="5"/><circle cx="900" cy="110" r="5"/><circle cx="1120" cy="220" r="5"/></g>
<text x="600" y="150" text-anchor="middle" fill="#00ff41" font-family="monospace" font-size="42" font-weight="700">SULTHAN HADIL</text><text x="600" y="200" text-anchor="middle" fill="#00d9ff" font-family="monospace" font-size="22">CYBERSECURITY RESEARCHER</text><text x="600" y="245" text-anchor="middle" fill="#b7ffd0" font-family="monospace" font-size="16">WEB SECURITY • LINUX • NETWORK ANALYSIS • SECURE BUILDING</text><rect x="40" y="40" width="1120" height="280" rx="14" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3s" repeatCount="indefinite"/></rect></svg>
