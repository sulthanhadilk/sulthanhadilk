<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Cybersecurity terminal</title><desc id="desc">Animated terminal showing Sulthan Hadil's security focus.</desc><rect width="1200" height="360" rx="18" fill="#050505" stroke="#00ff41" stroke-width="2"/><rect width="1200" height="42" rx="18" fill="#101820"/><circle cx="28" cy="21" r="7" fill="#ff5f56"/><circle cx="52" cy="21" r="7" fill="#ffbd2e"/><circle cx="76" cy="21" r="7" fill="#27c93f"/><text x="600" y="27" text-anchor="middle" fill="#8aa" font-family="monospace" font-size="14">~/security-lab</text><g font-family="monospace" font-size="22"><text x="40" y="92" fill="#00ff41">$ whoami</text><text x="40" y="130" fill="#b7ffd0">sulthanhadilk</text><text x="40" y="178" fill="#00ff41">$ focus --now</text><text x="40" y="216" fill="#00d9ff">web-security | linux | network-analysis</text><text x="40" y="264" fill="#00ff41">$ status</text><text x="40" y="302" fill="#b7ffd0">authorized-learning-only <tspan fill="#00ff41">█</tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text></g></svg>
